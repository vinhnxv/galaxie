packages:
  - packages/*
  - examples/*
  - tests/*
  - templates/*

# Link the template's registry-compatible ranges to matching local launch packages.
linkWorkspacePackages: true

# Resolve only versions published at least 7 days ago, to limit exposure to compromised releases.
minimumReleaseAge: 10080

overrides:
  'uuid@<11.1.1': 11.1.1
  'minimatch@>=7.0.0 <11.0.1': 11.0.1

allowBuilds:
  onnxruntime-node: false
  sharp: false
  protobufjs: false
  '@google/genai': false
  cpu-features: false
  ssh2: false
