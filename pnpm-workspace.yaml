packages:
  - packages/*
  - examples/*
  - tests/*

# Resolve only versions published at least 7 days ago, to limit exposure to compromised releases.
minimumReleaseAge: 10080

allowBuilds:
  onnxruntime-node: false
  sharp: false
  protobufjs: false
  '@google/genai': false
  cpu-features: false
  ssh2: false
