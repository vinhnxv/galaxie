[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxie"
version = "0.0.0"
description = "Python model and capability proxies for the galaxie JavaScript runtime."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["langchain-core>=1,<2", "langgraph>=1,<2"]

[project.optional-dependencies]
adk = ["google-adk==2.12.0"]
dspy = ["dspy==3.4.1"]
pydantic-ai = ["pydantic-ai-slim==2.60.0", "pydantic-graph==2.60.0"]

[tool.setuptools.packages.find]
where = ["src"]
