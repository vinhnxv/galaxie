[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ormsgpack"
version = "1.13.0"
description = "Limited pure-Python ormsgpack stand-in for the galaxie browser example."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["msgpack==1.1.2"]

[tool.setuptools.packages.find]
where = ["src"]
