[build-system]
requires = ["setuptools==84.1.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ormsgpack"
version = "1.13.0"
description = "Limited pure-Python ormsgpack stand-in for the galaxie browser example."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["msgpack==1.2.4"]

[tool.setuptools.packages.find]
where = ["src"]
