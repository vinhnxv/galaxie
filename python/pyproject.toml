[project]
name = "galaxie-python-tests"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = ["galaxie[pydantic-ai,dspy,adk]", "ormsgpack==1.13.0", "langgraph>=1,<2"]

[dependency-groups]
dev = ["pytest==9.0.3", "setuptools==84.1.0", "wheel==0.46.3", "openai==3.37.0"]

[tool.uv]
package = false
# galaxie disables DSPy's disk cache; its unused pickle-backed backend is not installed.
exclude-dependencies = ["diskcache"]
exclude-newer = "2026-11-03T00:00:00Z"
# The ADK extra would move three Pyodide-aligned pins; the overrides keep them (ADR-0022).
override-dependencies = [
  "opentelemetry-api==1.45.1", "opentelemetry-semantic-conventions==0.66b1",
  "tenacity==9.2.1", "websockets==17.3",
]
constraint-dependencies = [
  # Native tests use patched extensions; browser wheels are pinned independently in requirements.lock.
  "cryptography==50.0.2", "cffi==2.0.0", "pycparser==3.0",
  "msgpack==1.2.4", "pyasn1==0.6.5", "orjson==3.11.8", "pydantic==2.12.5",
  "pydantic-core==2.41.5", "xxhash==3.6.0", "zstandard==0.25.0",
  "regex==2026.3.32", "rpds-py==0.30.0", "pyyaml==6.0.3",
]

[tool.uv.workspace]
members = ["galaxie", "standins/ormsgpack", "standins/litellm"]

[tool.uv.sources]
galaxie = { workspace = true }
ormsgpack = { workspace = true }
litellm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["galaxie/tests", "../examples/rag-browser/agent_py/tests", "../examples/adk-recipes/agent_py/tests", "../tests/conformance/cases-python", "../tests/conformance/cases-pydantic-ai", "../tests/conformance/cases-pydantic-ai-delegation", "../tests/conformance/cases-dspy", "../tests/conformance/cases-adk-python"]
