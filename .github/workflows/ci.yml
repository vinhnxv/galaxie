name: ci

# The checks run as parallel jobs. The Python-heavy tests are split into groups (see
# GALAXIE_TEST_GROUP in vitest.config.ts) and skipped for a pull request whose changes cannot
# affect them (scripts/ci-scope.ts). A push to main always runs everything.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      python: ${{ steps.scope.outputs.python }}
      create: ${{ steps.scope.outputs.create }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: scope
        name: Decide whether the Python and create jobs can be skipped
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "$BASE...$HEAD") || {
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          printf '%s\n' "$files" | node scripts/ci-scope.ts | tee -a "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          python: "true"
      - run: pnpm run check:license
      - run: pnpm exec biome ci .
      - name: Build the Go and Python starter artifacts
        run: |
          pnpm --filter @galaxie-ai/starter-go run prepack
          pnpm exec tsc -p packages/ui-protocol/tsconfig.build.json
          pnpm exec tsc -p packages/core/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-kit/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-pyodide/tsconfig.build.json
          pnpm --filter @galaxie-ai/starter-python run prepack
      - name: Type-check with TypeScript 7
        run: pnpm run typecheck
      - name: Type-check with TypeScript 6 (ADR-0013)
        run: pnpm run typecheck:ts6

  dependency-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run check:dependency-licenses

  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run build:packages
      - run: pnpm run check:size

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The example builds pack the Python wheels, so this job builds them too.
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - run: pnpm run build
      - run: pnpm run check:deps
      - run: pnpm run check:docs

  nextjs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: pnpm --filter @galaxie-ai/example-nextjs-app-router test

  test-general:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          python: "true"
          browser: "true"
      - run: |
          pnpm --filter @galaxie-ai/starter-go run prepack
          pnpm exec tsc -p packages/ui-protocol/tsconfig.build.json
          pnpm exec tsc -p packages/core/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-kit/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-pyodide/tsconfig.build.json
          pnpm --filter @galaxie-ai/starter-python run prepack
      - run: CI=true GALAXIE_TEST_GROUP=general pnpm test

  # Runs the browser cases that use scripted models on Firefox and WebKit. It gathers mock-model
  # evidence only: the job fails on a case that is not in the known-failure list, never on a
  # listed one. Chromium in test-general stays the engine that gates every change.
  test-browser-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    name: test-browser-engines (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          python: "true"
          engine: ${{ matrix.engine }}
      - name: Run the browser cases on ${{ matrix.engine }}
        run: |
          pnpm --filter @galaxie-ai/starter-go run prepack
          pnpm exec tsc -p packages/ui-protocol/tsconfig.build.json
          pnpm exec tsc -p packages/core/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-kit/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-pyodide/tsconfig.build.json
          pnpm --filter @galaxie-ai/starter-python run prepack
          pnpm run compose:create
          pnpm exec vitest run --project browser --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/report.json" || true
          node scripts/check-browser-engine.ts "$RUNNER_TEMP/report.json" "$ENGINE" tests/browser-engines-known-failures.json
        env:
          CI: "true"
          GALAXIE_TEST_GROUP: general
          GALAXIE_BROWSER: ${{ matrix.engine }}
          ENGINE: ${{ matrix.engine }}

  test-python:
    needs: scope
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [python-dspy, python-pydantic, python-adk, python-rest]
    name: test-python (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
          go: "true"
          browser: "true"
      - run: |
          pnpm --filter @galaxie-ai/starter-go run prepack
          pnpm exec tsc -p packages/ui-protocol/tsconfig.build.json
          pnpm exec tsc -p packages/core/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-kit/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-pyodide/tsconfig.build.json
          pnpm --filter @galaxie-ai/starter-python run prepack
      - name: Test the Python group once
        run: |
          if [ "$GALAXIE_TEST_GROUP" = "python-rest" ]; then
            pnpm run compose:create
            status=0
            CI=true pnpm exec vitest run --project node tests/conformance/starter-python-*.node.test.ts --no-file-parallelism || status=$?
            CI=true GALAXIE_PYTHON_REST_SKIP_STARTERS=true pnpm exec vitest run || status=$?
            exit "$status"
          else
            CI=true pnpm test
          fi
        env:
          GALAXIE_TEST_GROUP: ${{ matrix.group }}

  python-checks:
    needs: scope
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - run: pnpm test:python
      - name: Type-check Python with pyright
        run: pnpm run typecheck:python

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          python: "true"
          browser: "true"
      - run: |
          pnpm --filter @galaxie-ai/starter-go run prepack
          pnpm exec tsc -p packages/ui-protocol/tsconfig.build.json
          pnpm exec tsc -p packages/core/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-kit/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-pyodide/tsconfig.build.json
          pnpm --filter @galaxie-ai/starter-python run prepack
      - run: pnpm run compose:create
      - name: Test the Go starter artifacts and Chromium acceptance
        run: pnpm exec vitest run --project node tests/conformance/starter-go-*.node.test.ts --no-file-parallelism
      - name: Test the Go module
        run: pnpm test:go

  create-clean:
    needs: [scope]
    if: needs.scope.outputs.create == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        framework: [langgraph-js, adk-js, adk-go, langgraph-python]
        node: [24]
        include:
          - framework: langgraph-js
            node: 22
    name: create-clean (${{ matrix.framework }} node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: ${{ matrix.framework == 'adk-go' }}
          python: ${{ matrix.framework == 'langgraph-python' }}
          browser: "true"
      - name: Install the target Node 22
        if: matrix.node == 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Capture the target Node 22 path
        if: matrix.node == 22
        id: node22
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      - name: Restore the repository Node
        if: matrix.node == 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install npm with release-age enforcement
        run: |
          npm install -g npm@12.2.2
          test "$(npm --version)" = "12.2.2"
      # Warm the artifacts before packing: the harness bounds each pack command to 300 seconds.
      - name: Prepare the Go starter artifact
        if: matrix.framework == 'adk-go'
        run: pnpm --filter @galaxie-ai/starter-go run prepack
      - name: Prepare the Python starter artifacts
        if: matrix.framework == 'langgraph-python'
        run: |
          pnpm exec tsc -p packages/ui-protocol/tsconfig.build.json
          pnpm exec tsc -p packages/core/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-kit/tsconfig.build.json
          pnpm exec tsc -p packages/adapter-pyodide/tsconfig.build.json
          pnpm --filter @galaxie-ai/starter-python run prepack
      - name: Build the create CLI
        run: pnpm exec tsc -p packages/create/tsconfig.build.json
      - name: Verify both generated kinds in a clean environment
        env:
          FRAMEWORK: ${{ matrix.framework }}
          TARGET_NODE: ${{ matrix.node }}
          NODE_22: ${{ steps.node22.outputs.path }}
        run: |
          args=()
          if [ "$TARGET_NODE" = "22" ]; then
            args+=(--node "22=$NODE_22")
          fi
          node scripts/verify-standalone.ts "${args[@]}" \
            --framework "$FRAMEWORK" --kind all --mode tarball \
            --clean-path --budget-minutes 10 --json "$RUNNER_TEMP/create-clean.json"
      - name: Report the clean-environment results and durations
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/create-clean.json" ]; then
            echo "No clean-environment results were produced." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$RUNNER_TEMP/create-clean.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const results = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/create-clean.json`, 'utf8'));
          const lines = results.map((result) => `| ${result.template} | ${result.node} | ${result.durationMs} |`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '| Project | Node | durationMs |',
            '| --- | --- | --- |',
            ...lines,
            '',
          ].join('\n'));
          NODE

  # The manifest builder rejects names that alias on a case-insensitive filesystem. Its tests for
  # that need one, so this job runs them on macOS; the Linux jobs skip them with a stated reason.
  case-insensitive-fs:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test the manifest builder on a case-insensitive filesystem
        run: pnpm exec vitest run tests/conformance/build-manifest.node.test.ts

  # One check that stands for the whole run: it fails when any job failed or was cancelled and
  # passes when jobs succeeded or were skipped, so a required check can name it alone.
  ci:
    if: always()
    needs:
      [
        scope,
        static,
        dependency-licenses,
        size,
        build,
        nextjs,
        test-general,
        test-browser-engines,
        test-python,
        python-checks,
        go,
        create-clean,
        case-insensitive-fs,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
