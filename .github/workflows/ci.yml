name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6
        with:
          version: "0.11.23"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: pnpm install --frozen-lockfile
      - name: Sync the pinned CPython environment
        run: uv sync --project python --locked
      - name: Fetch and build the pinned Python wheels
        run: |
          node scripts/fetch-python-wheels.ts
          node scripts/build-python-wheels.ts
      - run: pnpm run check:license
      - run: pnpm exec biome ci .
      - name: Type-check with TypeScript 7
        run: pnpm run typecheck
      - name: Type-check with TypeScript 6 (ADR-0013)
        run: pnpm run typecheck:ts6
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: CI=true pnpm test
      - run: pnpm test:python
      - name: Type-check Python with pyright
        run: pnpm run typecheck:python
      - run: pnpm run build
      - run: pnpm run check:deps
      - run: pnpm run check:docs
