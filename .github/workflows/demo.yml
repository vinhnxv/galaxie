name: demo

on:
  push:
    branches: [main]
    paths:
      - "examples/rag-browser/**"
      - "packages/**"
      - "python/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/demo.yml"
      - ".github/actions/setup/**"
  pull_request:
    paths:
      - "examples/rag-browser/**"
      - "packages/**"
      - "python/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/demo.yml"
      - ".github/actions/setup/**"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: Build the mock demo
        run: pnpm --filter @galaxie-ai/example-rag-browser exec vite build --mode mock
        env:
          VITE_GALAXIE_DEMO: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-dist
          path: examples/rag-browser/dist
          retention-days: 14
          if-no-files-found: error
      # GitHub Pages serves a project site under /<repository>/, so this second build sets the
      # base path. It runs only for a push to main, which is the only event that deploys.
      - name: Build the mock demo for GitHub Pages
        if: github.event_name == 'push'
        run: pnpm --filter @galaxie-ai/example-rag-browser exec vite build --mode mock --outDir dist-pages --emptyOutDir
        env:
          VITE_GALAXIE_DEMO: "1"
          GALAXIE_DEMO_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: examples/rag-browser/dist-pages

  deploy-demo:
    if: github.event_name == 'push'
    needs: build-demo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
