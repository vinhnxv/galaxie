name: demo

on:
  push:
    branches: [main]
    paths:
      - "examples/rag-browser/**"
      - "packages/**"
      - "python/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/demo.yml"
      - ".github/actions/setup/**"
  pull_request:
    paths:
      - "examples/rag-browser/**"
      - "packages/**"
      - "python/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/demo.yml"
      - ".github/actions/setup/**"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - name: Build the mock demo
        run: pnpm --filter @galaxie-ai/example-rag-browser exec vite build --mode mock
        env:
          VITE_GALAXIE_DEMO: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-dist
          path: examples/rag-browser/dist
          retention-days: 14
          if-no-files-found: error

# Add a deploy job only after the maintainer chooses a demo host and accepts the header limit.
