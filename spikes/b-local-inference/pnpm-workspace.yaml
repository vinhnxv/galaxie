# This spike is its own workspace, so the root install and CI never pull its dependencies.

# Resolve only versions published at least 7 days ago, as the root workspace does.
minimumReleaseAge: 10080

# protobufjs (a dependency of onnxruntime-web) has a postinstall script that only prints a
# version-scheme warning. The page does not need it, so it never runs.
allowBuilds:
  protobufjs: false
  # Node-only Transformers.js dependency; its postinstall is never needed by this page.
  onnxruntime-node: false
